name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/local/Dockerfile
          push: true
          tags: |
            ghcr.io/hfleury/horsemarketplacebk:latest
            ghcr.io/hfleury/horsemarketplacebk:${{ github.sha }}

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy/production/docker-compose.yml"
          target: "/opt/horsemarketplace"
          strip_components: 2

      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "migrations/"
          target: "/opt/horsemarketplace/migrations"
          strip_components: 1

      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cat <<'ENVFILE' > /opt/horsemarketplace/.env
            PSQL_HOST=postgres
            PSQL_DB_NAME=horsemktdb
            PSQL_USERNAME=horsemktuser
            PSQL_PORT=5432
            PSQL_PASSWORD=${{ secrets.PSQL_PASSWORD }}
            PSQL_SSLMODE=disable
            PASETO_KEY=${{ secrets.PASETO_KEY }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAILGUN_DOMAIN=${{ secrets.MAILGUN_DOMAIN }}
            MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}
            STORAGE_ENDPOINT=http://minio:9000
            STORAGE_PUBLIC_ENDPOINT=${{ secrets.STORAGE_PUBLIC_ENDPOINT }}
            STORAGE_REGION=us-east-1
            STORAGE_ACCESS_KEY_ID=${{ secrets.STORAGE_ACCESS_KEY_ID }}
            STORAGE_SECRET_ACCESS_KEY=${{ secrets.STORAGE_SECRET_ACCESS_KEY }}
            STORAGE_BUCKET_NAME=horsemarketplace
            MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            REDIS_ADDR=redis:6379
            ENVFILE
            cd /opt/horsemarketplace
            docker compose pull
            docker compose up -d --remove-orphans
